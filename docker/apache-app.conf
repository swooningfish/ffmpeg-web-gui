# Let the app's .htaccess files take effect (see README: Requirements)
<Directory /var/www/html>
	AllowOverride All
</Directory>

# Private folders, also blocked by their own .htaccess files. Repeated here
# because they are Docker volumes, which keep the .htaccess files of the
# image they were first created from.
<DirectoryMatch "^/var/www/html/(upload|logs|jobs|src|secrets)(/|$)">
	Require all denied
</DirectoryMatch>
